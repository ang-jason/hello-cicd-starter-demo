name: Hello World CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  test:
    name: CI - Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          #cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Check Source Files
        run: |
          echo "Checking public/index.html..."

          if [ ! -f "public/index.html" ]; then
            echo "❌ Required source file public/index.html does not exist"
            exit 1
          fi

          echo "✅ Required source file exists"

      - name: Test 5 + 4
        run: |
          RESULT=$((5 + 4))

          echo "Testing: 5 + 4 = $RESULT"

          if [ "$RESULT" -ne 9 ]; then
            echo "❌ Calculation test failed"
            exit 1
          fi

          echo "✅ Calculation test passed"

      - name: Validate Source Code
        run: npm run test:html

      - name: CI Completed
        run: |
          echo "================================"
          echo "✅ ALL CI TESTS PASSED"
          echo "================================"

  deploy:
    name: CD - Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs:
      - test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          #command: deploy
          command: pages deploy public --project-name=hello-cicd --branch=main
          
      - name: Show Deployment URL
        run: echo "${{ steps.deploy.outputs.deployment-url }}"

      - name: Deployment Completed
        run: |
          echo "================================"
          echo "🚀 DEPLOYMENT COMPLETED"
          echo "================================"
